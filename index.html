<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a36" />
    <meta name="description" content="CatSize: compare Cat dozers, haulers and excavators, and see when to move up or down a size." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CatSize" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="preload" href="./art/splash.webp" as="image" />
    <title>CatSize – Cat dozers, haulers, excavators</title>
    <style>
      /* Splash screen: shown for 3 seconds on every load, then fades out. */
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(ellipse at 50% 40%, #2b3a4a 0%, #1f2a36 45%, #121a22 100%);
        transition: opacity 0.45s ease;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash img { width: min(72vw, 52vh, 440px); height: auto; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.45)); }
      #splash .bar { width: min(72vw, 360px); height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
      #splash .fill { height: 100%; width: 0%; border-radius: 6px;
        background: repeating-linear-gradient(-45deg, #fec203 0 12px, #e5ad00 12px 24px); }
      #splash .status { color: #c9d4df; font-size: 14px; letter-spacing: 0.02em; min-height: 1.2em; margin-top: -14px; }
      @media print { #splash { display: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading CatSize">
      <img src="./art/splash.webp" alt="CatSize" />
      <div class="bar"><div class="fill"></div></div>
      <div class="status">Loading…</div>
    </div>
    <script>
      // Fake loading bar: fills unevenly over 3 seconds, then the splash fades away.
      (function () {
        var DURATION = 3000;
        var splash = document.getElementById('splash');
        var fill = splash.querySelector('.fill');
        var status = splash.querySelector('.status');
        var steps = ['Loading machine specs…', 'Loading fuel data…', 'Calculating costs…', 'Sizing up the fleet…', 'Ready'];
        var start = performance.now();
        function ease(t) {
          // Quick start, a couple of pauses, quick finish.
          var p = t < 0.35 ? t * 1.6 : t < 0.55 ? 0.56 + (t - 0.35) * 0.4 : t < 0.8 ? 0.64 + (t - 0.55) * 1.0 : 0.89 + (t - 0.8) * 0.55;
          return Math.min(1, p);
        }
        function frame(now) {
          var t = Math.min(1, (now - start) / DURATION);
          fill.style.width = (ease(t) * 100).toFixed(1) + '%';
          status.textContent = steps[Math.min(steps.length - 1, Math.floor(t * steps.length))];
          if (t < 1) requestAnimationFrame(frame);
          else {
            splash.classList.add('done');
            setTimeout(function () { splash.remove(); }, 500);
          }
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
